<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0b121a">
<title>Iniciar sesión · Dashboard DSTA</title><link rel="stylesheet" href="/auth.css"><script src="/login.js" defer></script></head>
<body><main class="card">
<div class="kicker">PMO-DSTA</div><h1>Dashboard Gestión DSTA</h1><p>Entra con tu cuenta. Cada persona ve solo su propio espacio.</p>
<form id="login-form">
<label for="email">Correo</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
<label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
<button type="submit">Entrar</button>
</form>
<p id="message" class="message" role="status" aria-live="polite"></p>
<p class="note">¿Recibiste una invitación? Ábrela primero para crear tu contraseña.</p>
</main></body></html>
